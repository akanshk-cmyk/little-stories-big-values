[project]
name = "little-stories-big-values"
version = "0.1.0"
description = "Parent-guided storytelling application"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.14.1",
  "websocket-client>=1.8,<2",
  "Pillow>=11,<13",
  "pypdf>=6,<7",
  "certifi>=2025",
  "httpx>=0.28,<0.29",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["openpyxl>=3.1,<4"]
retrieval = [
  "onnxruntime>=1,<2",
  "tokenizers>=0.22,<1",
  "numpy>=2,<3",
  "flashrank>=0.2,<1",
]
